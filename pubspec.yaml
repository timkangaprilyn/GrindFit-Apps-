name: flutter_application_1
description: "GrindFit fitness app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Keep the native Core/Auth/Functions plugins on compatible Android APIs.
  firebase_core: 4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^6.2.1
  google_generative_ai: ^0.4.0
  fl_chart: ^0.68.0
  intl: ^0.20.3
  video_player: ^2.8.6
  shared_preferences: ^2.5.6
  flutter_tts: ^4.2.5
  share_plus: ^13.3.1
  cloud_functions: 6.3.6
  flutter_local_notifications: ^23.0.0
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  firebase_core_platform_interface: any
flutter:
  uses-material-design: true

  assets:
    - assets/images/grindfit_logo.png
    - assets/images/google_logo.png
    - assets/images/fitness_hero.png
    - assets/images/goal_hero.png
    - assets/images/splash_bg.png
    - assets/images/env_hero.png
    - assets/images/env_indoor.png
    - assets/images/env_outdoor.png
    - assets/images/duration_hero.png
    - assets/images/duration_bottom.png
    - assets/images/schedule_hero.png
    - assets/images/schedule_bottom.png
    - assets/exercises/
